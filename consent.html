<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이용·환불 동의서</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/consent.css">
</head>
<body>
  <header class="topbar no-print">
    <h1>동의서</h1>
    <nav class="tabs" role="tablist">
      <a class="tab-link" href="index.html">← 재고관리</a>
      <button class="tab active" data-doc="usage">이용동의서</button>
      <button class="tab" data-doc="refund">환불동의서</button>
    </nav>
  </header>

  <main>
    <details class="panel no-print" id="settings-panel">
      <summary><h2>사업자 정보 · 환불 규정 설정</h2></summary>
      <p>여기 입력한 내용은 이 브라우저에 저장되어 두 동의서에 자동으로 들어갑니다. 고객 정보와 서명은 저장되지 않습니다. 일반적인 표준 양식이므로 업종과 실제 운영 방식에 맞게 문구를 확인하세요.</p>
      <form id="settings-form" class="grid">
        <label>상호<input name="bizName" placeholder="예: OO상사"></label>
        <label>대표자<input name="owner"></label>
        <label>사업자등록번호<input name="bizNo" placeholder="000-00-00000"></label>
        <label>연락처<input name="bizPhone"></label>
        <label class="wide">주소<input name="bizAddress"></label>
        <label>청약철회(환불) 가능 기간(일)<input name="refundDays" type="number" min="0" step="1" value="7"></label>
        <label>환불 처리 기한(영업일)<input name="refundProcessDays" type="number" min="0" step="1" value="3"></label>
        <label>개인정보 보유 기간<input name="retention" value="거래 종료 후 5년"></label>
        <label>서비스/상품 구분<input name="serviceName" placeholder="예: 물품 구매, 대여, 회원권"></label>
        <label class="wide">추가 이용 규정 (한 줄에 한 항목)<textarea name="extraUsage" rows="3"></textarea></label>
        <label class="wide">추가 환불 규정 (한 줄에 한 항목)<textarea name="extraRefund" rows="3" placeholder="예: 이용 개시 후 환불 시 이용 일수만큼 차감 후 환불"></textarea></label>
      </form>
    </details>

    <div class="toolbar no-print">
      <button id="btn-clear">고객 입력 지우기</button>
      <button id="btn-print" class="primary">인쇄 / PDF 저장</button>
    </div>

    <article id="doc" class="paper"></article>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="src/consent.js"></script>
</body>
</html>
